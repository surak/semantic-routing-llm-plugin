# Routes exercised by test/run_e2e.sh. "mock" is test/mock_server.py.
x-instance: &instance
  provider: openai-compatible
  weight: 1
  auth:
    header:
      Authorization: "Bearer llm-token"
x-system-one: &system_one
  endpoint: http://mock:9000/v1/systemone
  model: jev-latest
  auth:
    header:
      Authorization: "Bearer s1-token"
  threshold: 0.5
  fallback: general
  debugging: true

routes:
  # 1. route by the System One ranking
  - id: route
    uri: /route
    plugins:
      ai-proxy-multi:
        balancer:
          algorithm: system_one
        system_one_opts: *system_one
        instances:
          - <<: *instance
            name: code
            description: "Programming, debugging and code review."
            options: { model: mock-coder }
            override: { endpoint: http://mock:9000/code/v1/chat/completions }
          - <<: *instance
            name: math
            description: "Proofs, derivations and quantitative reasoning."
            options: { model: mock-math }
            override: { endpoint: http://mock:9000/math/v1/chat/completions }
          - <<: *instance
            name: general
            description: "Everything else: chat, writing, summaries."
            options: { model: mock-general }
            override: { endpoint: http://mock:9000/general/v1/chat/completions }

  # 2. the top-ranked instance fails: retry the next one in the ranking
  #    (threshold 0: every ranked instance is eligible). The endpoint has no
  #    path, so the API's /v1/systemone is used.
  - id: retry
    uri: /retry
    plugins:
      ai-proxy-multi:
        balancer:
          algorithm: system_one
        system_one_opts:
          <<: *system_one
          endpoint: http://mock:9000
          threshold: 0
        fallback_strategy: [http_5xx]
        instances:
          - <<: *instance
            name: code
            description: "Programming, debugging and code review."
            options: { model: mock-coder }
            override: { endpoint: http://mock:9000/fail/v1/chat/completions }
          - <<: *instance
            name: math
            description: "Proofs, derivations and quantitative reasoning."
            options: { model: mock-math }
            override: { endpoint: http://mock:9000/math/v1/chat/completions }
          - <<: *instance
            name: general
            description: "Everything else: chat, writing, summaries."
            options: { model: mock-general }
            override: { endpoint: http://mock:9000/general/v1/chat/completions }
  # 3. same, but the runners-up are below the threshold: retry the fallback
  - id: retry-threshold
    uri: /retry-threshold
    plugins:
      ai-proxy-multi:
        balancer:
          algorithm: system_one
        system_one_opts:
          <<: *system_one
          threshold: 0.5
        fallback_strategy: [http_5xx]
        instances:
          - <<: *instance
            name: code
            description: "Programming, debugging and code review."
            options: { model: mock-coder }
            override: { endpoint: http://mock:9000/fail/v1/chat/completions }
          - <<: *instance
            name: math
            description: "Proofs, derivations and quantitative reasoning."
            options: { model: mock-math }
            override: { endpoint: http://mock:9000/math/v1/chat/completions }
          - <<: *instance
            name: general
            description: "Everything else: chat, writing, summaries."
            options: { model: mock-general }
            override: { endpoint: http://mock:9000/general/v1/chat/completions }
#END
