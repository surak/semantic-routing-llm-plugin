# APISIX config for the end-to-end tests: standalone (YAML) mode with the
# system_one overlay first on the Lua path. The default plugin list is kept.
apisix:
  node_listen: 9080
  extra_lua_path: "/opt/system-one/?.lua"
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
nginx_config:
  error_log_level: info
