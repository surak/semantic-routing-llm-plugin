# Helm values for apache/apisix (chart 2.18.x, APISIX 3.19) with ai-decision-router.
# Used by deploy/kubernetes/deploy.sh; see deploy/kubernetes/README.md.
image:
  tag: 3.19.0-ubuntu

service:
  type: ClusterIP

apisix:
  admin:
    credentials:
      secretName: apisix-admin   # created by deploy.sh with a random key
  customPlugins:
    enabled: true
    luaPath: "/opts/custom_plugins/?.lua"
    plugins:
      - name: ai-decision-router
        attrs: {}
        configMap:
          name: ai-decision-router
          mounts:
            - key: ai-decision-router.lua
              path: /opts/custom_plugins/apisix/plugins/ai-decision-router.lua
  # The chart only adds customPlugins when this list is set, and the list
  # replaces APISIX's defaults -- so it repeats the APISIX 3.19 default list
  # (110 plugins, from apisix/cli/config.lua).
  plugins:
    - real-ip
    - ai
    - client-control
    - proxy-buffering
    - proxy-control
    - request-id
    - zipkin
    - ext-plugin-pre-req
    - fault-injection
    - mocking
    - serverless-pre-function
    - cors
    - ip-restriction
    - ua-restriction
    - referer-restriction
    - csrf
    - uri-blocker
    - request-validation
    - chaitin-waf
    - multi-auth
    - openid-connect
    - saml-auth
    - cas-auth
    - authz-casbin
    - authz-casdoor
    - wolf-rbac
    - ldap-auth-advanced
    - ldap-auth
    - hmac-auth
    - basic-auth
    - jwt-auth
    - jwe-decrypt
    - key-auth
    - dingtalk-auth
    - feishu-auth
    - acl
    - consumer-restriction
    - attach-consumer-label
    - forward-auth
    - opa
    - authz-keycloak
    - data-mask
    - proxy-cache
    - body-transformer
    - ai-prompt-template
    - ai-prompt-decorator
    - ai-prompt-guard
    - ai-rag
    - ai-rate-limiting
    - ai-proxy-multi
    - ai-proxy
    - ai-cache
    - ai-aws-content-moderation
    - ai-aliyun-content-moderation
    - ai-lakera-guard
    - proxy-mirror
    - graphql-proxy-cache
    - proxy-rewrite
    - workflow
    - api-breaker
    - graphql-limit-count
    - limit-conn
    - limit-count
    - limit-req
    - gzip
    - server-info
    - traffic-label
    - traffic-split
    - redirect
    - response-rewrite
    - openapi-to-mcp
    - oas-validator
    - mcp-bridge
    - degraphql
    - kafka-proxy
    - websocket-proxy
    - grpc-transcode
    - grpc-web
    - http-dubbo
    - public-api
    - prometheus
    - datadog
    - lago
    - loki-logger
    - elasticsearch-logger
    - echo
    - loggly
    - http-logger
    - splunk-hec-logging
    - skywalking-logger
    - google-cloud-logging
    - sls-logger
    - tcp-logger
    - kafka-logger
    - rocketmq-logger
    - syslog
    - udp-logger
    - file-logger
    - clickhouse-logger
    - tencent-cloud-cls
    - inspect
    - example-plugin
    - aws-lambda
    - azure-functions
    - openwhisk
    - openfunction
    - serverless-post-function
    - ext-plugin-post-req
    - ext-plugin-post-resp
    - ai-request-rewrite

etcd:
  enabled: true
  replicaCount: 1
  # Persistent etcd: APISIX's routes live in etcd, so without a volume every
  # etcd restart (including Helm upgrades) would wipe the configuration.
  persistence:
    enabled: true
    size: 1Gi
