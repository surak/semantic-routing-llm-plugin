# Helm values for apache/apisix (chart 2.18.x, APISIX 3.19) with the system_one
# balancer of ai-proxy-multi. Used by deploy/kubernetes/deploy.sh.
#
# The changed Lua modules (overlay/) come from the ConfigMap apisix-system-one
# and are mounted at /opts/system-one, which is put first on the Lua path, so
# they replace the bundled ai-proxy-multi. APISIX's default plugin list is kept.
image:
  tag: 3.19.0-ubuntu

service:
  type: ClusterIP

apisix:
  admin:
    credentials:
      secretName: apisix-admin   # created by deploy.sh with a random key
  customPlugins:
    # only used for its luaPath: no extra plugin is registered
    enabled: true
    luaPath: "/opts/system-one/?.lua"
    plugins: []

extraVolumes:
  - name: system-one
    configMap:
      name: apisix-system-one
      items:
        - key: ai-proxy-multi.lua
          path: apisix/plugins/ai-proxy-multi.lua
        - key: schema.lua
          path: apisix/plugins/ai-proxy/schema.lua
        - key: system-one.lua
          path: apisix/plugins/ai-proxy/system-one.lua

extraVolumeMounts:
  - name: system-one
    mountPath: /opts/system-one
    readOnly: true

etcd:
  enabled: true
  replicaCount: 1
  # Persistent etcd: APISIX's routes live in etcd, so without a volume every
  # etcd restart (including Helm upgrades) would wipe the configuration.
  persistence:
    enabled: true
    size: 1Gi
